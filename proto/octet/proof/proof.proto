// Public-safe vendored copy of the SDK's octet/proof/proof.proto.
//
// Mirrors the verifiable proof wire contract only. The SDK's internal
// detection-pipeline types are intentionally NOT vendored here. This subset's
// field numbers and types match the SDK's upstream octet.proof wire schema, so
// a full proof decodes byte-for-byte.
//
// Cryptographic proof-of-location types.
syntax = "proto3";
package octet.proof;
option java_multiple_files = true;
option java_package = "com.octetproof.sdk.model.proto";
option swift_prefix = "ON";

// --- Location Proof Verdict ---
// Public spoofing-detection outcome (categorical only). Lives in the proof
// package upstream; vendored here because LocationProof.spoofing_verdict reads
// it. The signals/heuristics that produce it are never vendored.
enum LocationProofVerdict {
  VERDICT_UNSPECIFIED = 0;
  VERIFIED = 1;
  PLAUSIBLE = 2;
  SUSPICIOUS = 3;
  NOT_PROVABLE = 4;
}

// --- Inside/outside verdict ---
// The device's own inside/outside answer for the claimed region, signed into the
// proof via the octet-semantic-binding-v2 preimage. A trichotomy:
// INDETERMINATE must survive as itself, never collapse into a boolean.
// LOCATION_VERDICT_UNSPECIFIED (or a v1 proof) means "no signed verdict".
enum LocationVerdict {
  LOCATION_VERDICT_UNSPECIFIED = 0;
  INSIDE = 1;
  OUTSIDE = 2;
  INDETERMINATE = 3;
}

// --- Proof Level ---

enum ProofLevel {
  LEVEL_UNSPECIFIED = 0;
  ON_EARTH = 1;
  COUNTRY = 2;
  CITY = 3;
  CONTINUOUS_AREA = 4;
  CONTINUOUS_VOLUME = 5;
  // First-order administrative subdivision identified by an ISO 3166-2 code
  // (e.g. "US-CA", "FR-75"). Finer than COUNTRY, coarser than CITY; appended
  // at the end (=6) to preserve wire compatibility.
  SUBDIVISION = 6;
}

// --- Proof Region ---

message ProofRegion {
  oneof region {
    EarthRegion earth = 1;
    CountryRegion country = 2;
    CityRegion city = 3;
    EllipseRegion ellipse = 4;
    H3PolygonSet h3_polygon_set = 5;
    BoundingBox3DRegion bounding_box_3d = 6;
    SubdivisionRegion subdivision = 7;  // ISO 3166-2 (e.g. "US-CA", "FR-75")
    S2CellSet cell_set = 8;             // union of S2 cells, canonical form
    S2VoxelSet voxel_set = 9;           // S2 cells × height ranges, canonical form
  }
}

message EarthRegion {
  double max_altitude_meters = 1;  // default: 10000
}

message CountryRegion {
  string iso_code = 1;
}

// First-order administrative subdivision identified by an ISO 3166-2
// code, e.g. "US-CA" (California), "US-TX" (Texas), "FR-75" (Paris),
// "JP-13" (Tokyo). The country prefix is part of the code; an empty
// or malformed iso_code is rejected at construction.
message SubdivisionRegion {
  string iso_code = 1;
}

message CityRegion {
  string name = 1;
  double center_lat = 2;
  double center_lon = 3;
  double radius_meters = 4;
}

// Ground ellipse. Disc is the degenerate case (semi_major_m == semi_minor_m,
// heading_deg = 0).
message EllipseRegion {
  LatLon center = 1;
  double semi_major_m = 2;
  double semi_minor_m = 3;
  double heading_deg = 4;  // bearing of semi-major axis, [0, 360)
}

// Union of H3 cells. Each cell_id encodes its own resolution in its high
// bits; the SDK picks the coarsest resolution per query that satisfies
// the predicate's accuracy needs.
message H3PolygonSet {
  repeated fixed64 cell_ids = 1;
}

// Union of S2 cells (https://s2geometry.io) at mixed levels, each a standard
// 64-bit S2 CellId. Must be canonical: exactly its own S2 normalisation (sorted
// ascending, pairwise disjoint, no 4 siblings left unmerged), non-empty, and at
// most 16,384 cells. A non-canonical set is rejected, never normalised.
message S2CellSet {
  repeated fixed64 cell_ids = 1;
}

// One S2 cell × one height interval: [f_min · b, (f_max + 1) · b) metres of
// WGS84 ellipsoidal height, with bin b = 2^(25 − f_zoom) m as in Spatial ID.
// 0 ≤ f_zoom ≤ 32 and −2^f_zoom ≤ f_min ≤ f_max ≤ 2^f_zoom − 1.
message S2Voxel {
  fixed64 cell_id = 1;
  uint32 f_zoom = 2;
  sint64 f_min = 3;  // inclusive
  sint64 f_max = 4;  // inclusive
}

// A 3D region: S2 cells, each with one or more height intervals. Must be
// canonical: entries sorted by (cell_id, lower bound), each interval at its
// coarsest zoom, intervals of one cell neither overlapping nor touching, cells
// pairwise disjoint, no 4 siblings with identical intervals left unmerged, at
// most 16,384 entries, and at least one entry bounded in height (a set that
// covers all heights everywhere is a cell_set). A non-canonical set is
// rejected, never normalised.
message S2VoxelSet {
  repeated S2Voxel voxels = 1;
}

message LatLon {
  double latitude = 1;
  double longitude = 2;
}

message BoundingBox3DRegion {
  double min_latitude = 1;
  double max_latitude = 2;
  double min_longitude = 3;
  double max_longitude = 4;
  double min_altitude = 5;
  double max_altitude = 6;
}

// --- Location uncertainty ---

// Calibration state of a nominal uncertainty region. Separate from
// LocationProofVerdict: accuracy calibration and adversarial trust answer
// different questions.
enum UncertaintyCalibrationStatus {
  UNCERTAINTY_CALIBRATION_UNSPECIFIED = 0;
  UNCERTAINTY_UNCALIBRATED = 1;
  UNCERTAINTY_NOMINAL_CALIBRATED = 2;
  UNCERTAINTY_PROTECTION_CALIBRATED = 3;
}

// Vertical uncertainty relative to an ellipsoidal-altitude estimate. Horizontal
// and vertical coverage are independent; two marginal 95% bounds are not one
// joint 95% volume.
message VerticalUncertaintyInterval {
  double center_altitude_meters = 1;
  double below_meters = 2;
  double above_meters = 3;
  uint32 coverage_ppm = 4;
}

// Statistical uncertainty of the location estimate behind a proof.
// `nominal_region` is the estimator's statistical region; claimed_region stays
// the single region predicates use. Signed via the uncertaintyFields stage
// (octet-uncertainty-binding-v1).
message LocationUncertainty {
  ProofRegion nominal_region = 1;
  // 950000 = nominal 95% coverage. Zero = percentile not declared, never 0%.
  uint32 nominal_coverage_ppm = 2;
  optional VerticalUncertaintyInterval vertical_interval = 3;
  // SHA-256 of the frozen calibration profile. Empty when uncalibrated.
  bytes calibration_profile_sha256 = 4;
  UncertaintyCalibrationStatus calibration_status = 5;
  // Upper bound on P(error outside claimed_region), in parts per million.
  // Present only for UNCERTAINTY_PROTECTION_CALIBRATED.
  optional uint32 protection_failure_risk_ppm = 6;
  int64 estimate_timestamp_ms = 7;
}

// --- ZK Proof ---

enum ZKBackend {
  BACKEND_UNSPECIFIED = 0;
  GROTH16 = 1;
  PLONK = 2;
  HALO2 = 3;
  PLACEHOLDER = 4;
  COMMITMENT_ONLY = 5;
}

message ZKProofData {
  ZKBackend backend = 1;
  bytes proof_bytes = 2;
  repeated string public_inputs = 3;
  string verification_key_id = 4;
}

// --- Device Attestation ---

enum SecurityLevel {
  SEC_UNSPECIFIED = 0;
  STRONG_BOX = 1;       // Android StrongBox / iOS Secure Enclave + App Attest
  TEE = 2;              // Android TEE
  HARDWARE_ONLY = 3;    // iOS Secure Enclave only
  SOFTWARE = 4;         // No hardware backing
}

message DeviceAttestation {
  string key_id = 1;
  bytes signature = 2;
  repeated bytes certificate_chain = 3;    // Android cert chain
  optional string play_integrity_token = 4; // Android only
  DeviceIntegrityVerdict integrity_verdict = 5;
  optional string session_id = 6;
  SecurityLevel security_level = 7;
  // iOS Apple App Attest. The attestation object (CBOR) is carried once per
  // attested key; assertions are produced per attestation cadence. The nonce
  // is bound into the signed challenge so a verifier can tie the attestation
  // to this proof. All optional — absent on Android / when unavailable.
  optional bytes app_attest_attestation = 8;
  optional bytes app_attest_assertion = 9;
  optional bytes attestation_nonce = 10;
}

enum IntegrityVerdictStatus {
  INTEGRITY_UNSPECIFIED = 0;
  INTEGRITY_PENDING = 1;
  INTEGRITY_UNAVAILABLE = 2;
  INTEGRITY_VERIFIED_COMPLIANT = 3;
  INTEGRITY_VERIFIED_NON_COMPLIANT = 4;
}

message DeviceIntegrityVerdict {
  optional string token = 1;
  int64 request_timestamp_ms = 2;
  string nonce = 3;
  IntegrityVerdictStatus status = 4;
  optional string error_message = 5;
}

// --- Stage Attestation Chain ---

message StageAttestation {
  string stage = 1;
  int64 timestamp_ms = 2;
  bytes data_hash = 3;
  bytes signature = 4;
  optional bytes previous_hash = 5;
}

// --- Location Proof (Crypto Artifact) ---
//
// Public-safe subset of the SDK's LocationProof. Field numbers and wire types
// match the SDK's post-PFG slim schema exactly, so a full proof decodes here
// byte-for-byte. Tags 9, 14 and 15 carried SDK-internal pipeline fields that
// are excluded from the public contract; upstream reserves them so they are
// never reused, and we mirror that here. The verifier reads only the fields it
// verifies — `previous_token_hash` decodes but is not acted on in v1.

message LocationProof {
  string id = 1;
  ProofRegion claimed_region = 2;
  ProofLevel level = 3;
  ZKProofData zk_proof = 4;
  bytes position_commitment = 5;
  bytes nullifier = 6;
  int64 timestamp_ms = 7;
  DeviceAttestation device_attestation = 8;
  repeated StageAttestation stage_attestations = 10;
  LocationProofVerdict spoofing_verdict = 11;
  string sdk_version = 12;
  string platform = 13;  // "android" or "ios"
  bytes previous_token_hash = 16;  // hash of the prior proof's token (proof chaining)
  // Device's inside/outside verdict for claimed_region. Signed via the
  // octet-semantic-binding-v2 preimage; UNSPECIFIED / a v1 proof ⇒ no signed
  // verdict. Tag 17: next free after the reserved 9/14/15.
  LocationVerdict location_verdict = 17;

  // The region the predicate was asked about (, semantic-binding v3). Carries
  // the REFERENCE (region_type + the v2 region_id of that region), not geometry,
  // so a verifier can read a signed INSIDE/OUTSIDE for a specific region. Signed
  // via the octet-semantic-binding-v3 preimage. Present exactly when the query is
  // bindable AND answered: absent for background/raw proofs and for a city query
  // (city has no v2 region_id, so it stays unbound). See RegionRef.
  RegionRef query_region = 18;

  // The readable list of caller content the proof commits (caller-metadata
  // phase B): one entry per committed item, in preimage order. Carries digests
  // only — no salt, no value. Not itself signed: it is checked by recomputing
  // the callerMetadata stage's preimage from it. Absent when the proof commits
  // no content.
  CallerManifest caller_manifest = 19;

  // Statistical uncertainty of the estimate (highres proofs). Signed via the
  // uncertaintyFields stage. An early highres build carried this at tag 18, which
  // is query_region here; such a proof fails to decode rather than being misread.
  optional LocationUncertainty uncertainty = 20;

  reserved 9, 14, 15;
}

// The committed caller content, readable (caller-metadata phase B). Entries are
// in preimage order, so the callerMetadata stage hash can be recomputed from
// them without the presenter.
message CallerManifest {
  repeated CallerManifestEntry entries = 1;
}

message CallerManifestEntry {
  string key = 1;           // UTF-8, 1–64 bytes, compared byte for byte
  string content_type = 2;  // strict RFC 6838 type/subtype, 1–127 bytes
  uint64 size = 3;          // len(value), salt excluded
  bytes sha256 = 4;         // entry_digest = SHA256(salt ‖ value), 32 bytes
  // Opaque, unauthenticated hint for where the bytes can be fetched (empty =
  // none, at most 256 bytes). Outside the preimage: it never affects the result,
  // and fetched bytes must still match sha256. Never a URL with credentials.
  string locator = 5;
}

// Reference to a region by its v2 claim-table encoding (, semantic-binding
// v3). region_type is the ProofRegion oneof field number (1..9); region_id is the
// same bytes semantic-binding folds for that region's claimed_region (ISO code,
// f64-be altitude, or a 32-byte geometry digest). It names a region without
// revealing its geometry beyond a digest.
message RegionRef {
  uint32 region_type = 1;
  bytes  region_id   = 2;
}
