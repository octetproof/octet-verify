[package]
name = "octet-verify"
version = "1.8.0"
edition = "2021"
description = "Standalone, independent verifier for Octet LocationProof artifacts. Checks authenticity and integrity (signatures, hash-chain, freshness, region claim) without any device-side secret or proof-creation logic."
repository = "https://github.com/octetproof/octet-verify"
readme = "README.md"
license = "Apache-2.0"
# GitHub-only release for now; `publish = false` guards against an accidental
# `cargo publish` to crates.io.
publish = false

[lib]
name = "octet_verify"
path = "src/lib.rs"

[[bin]]
name = "octet-verify"
path = "src/bin/octet-verify.rs"

# Out-of-band key-enrolment demo. Uses the appattest-only enrolment API, so it is
# built only when that feature is on (a default `cargo build` skips it).
[[example]]
name = "enroll_e2e"
required-features = ["appattest"]

[features]
# Off by default: the core verifier is a small, publicly-auditable trust
# anchor with no network or JSON-parsing surface. `cargo build` /
# `cargo install` of the default build pulls none of the deps below, so the
# crypto + verification path that the public is asked to trust stays lean.
#
# `--features net` adds the backend fetch/watch/range subcommands, which talk
# to the (untrusted) Octet proof ingestion API. See VERIFICATION-SPEC.md
# "Backend fetch mode": the backend is transport+index only; fetched bytes go
# through the exact same local verification pipeline as a local file.
default = []
net = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:base64", "dep:ctrlc"]
# Offline Apple App Attest verification, via the shared `octet-attest-verify`
# crate (the auditable attestation-root layer the v1 NOTE below anticipated —
# we depend on the shared crate rather than duplicating its logic here). Off by
# default so the lean public verifier keeps no X.509 / CBOR / JSON surface unless
# asked. Pulls serde_json only for the out-of-band key-enrolment bundle
# (`appattest_layer::bundle_from_json`); the proto bundle path reuses prost.
appattest = ["dep:octet-attest-verify", "dep:base64", "dep:serde", "dep:serde_json"]
# Opt-in ONLINE Google Play Integrity check. Calls the first-party decode
# endpoint (POST /v1/integrity/decode) with the verifier's own service credential,
# then runs the offline crate primitives (from_decoded_json / check_binding_packages
# / check_freshness) on the returned verdict. Needs the network (ureq, via `net`)
# AND the shared crate's `playintegrity` module. Off by default → the
# `play-integrity` check reports NOT-CHECKED; the lean default build is unchanged.
playintegrity = ["net", "dep:octet-attest-verify", "octet-attest-verify/playintegrity", "dep:serde", "dep:serde_json", "dep:base64"]
# Browser verdict profile (`octet-verify browser-verdict`): verifies the octet
# browser product's signed verdict token (compact JWS, EdDSA or ES256) and its
# session chain against published keys. Needs JSON + base64url; fetching a JWKS
# from a URL additionally needs `net` (a JWKS file works offline).
browser = ["dep:serde_json", "dep:base64"]
# Caller-metadata presenter manifest (`--caller-manifest`, `--content`): parses
# the portable JSON manifest so content an integrator bound into a proof can be
# checked against its `callerMetadata` stage. The check itself, the preimage and
# the streaming digest are in every build; only the JSON parsing needs this.
caller-metadata = ["dep:serde_json"]
# H3 point-in-region containment for `--expect-region-contains` against an
# `h3_polygon_set` proof, via the pure-Rust `h3o` crate. Off by default (h3o is
# far heavier than the lean core); without it an h3 containment assertion FAILs
# closed, so an h3 proof is never falsely asserted.
h3 = ["dep:h3o"]

[dependencies]
prost = "0.13"
h3o = { version = "0.11", optional = true, default-features = false } # feature `h3` only
sha2 = "0.10"
p256 = "0.13"            # ECDSA P-256 verify (DER + raw), SEC1 public keys
ed25519-dalek = "2"     # Ed25519 transport-signature verify
anyhow = "1"
# NOTE: no X.509 dependency in the default build. The Android leaf key is pulled
# from the certificate's SubjectPublicKeyInfo with a small dependency-free scan.
# Full X.509 parsing + chain-to-root validation lives in the shared
# `octet-attest-verify` crate, pulled only under `--features appattest`.

# --- App Attest layer (feature = "appattest" only) ---
# Dual-specified on purpose: `git`+`rev` pins the exact source for reproducible
# private builds (a rev, not a branch); `version` is the matching crates.io
# release. Local/private builds resolve via git and verify the rev's crate
# version satisfies `version` (so rev and version must be bumped together);
# `cargo publish` drops the git source and keeps only `version`, so the crate is
# directly publishable to crates.io with no manifest surgery. Only compiled under
# `--features appattest`; a default / `--features net` build resolves it but
# pulls none of its code.
octet-attest-verify = { version = "2.5.0", git = "https://github.com/octetproof/octet-attest-verify", rev = "115f0c83de23bd086c3ad05f151170d0464ef8e4", optional = true, features = ["config", "keyattest"] }

# --- backend fetch mode (feature = "net" only) ---
# rustls TLS (no OpenSSL / system dep); we parse bodies ourselves via
# serde_json, so ureq's own "json" helper feature is intentionally not enabled.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }   # proof_bytes_b64 (base64-url-no-pad)
ctrlc = { version = "3", optional = true }       # graceful Ctrl-C stop for `watch` (verdict-coded exit)
x509-cert = "0.2.5"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
p256 = "0.13"      # sign synthetic proofs in the golden/roundtrip harness
base64 = "0.22"    # encode proof_bytes_b64 in the backend stub-server vectors
serde_json = "1"   # parse the session-binding golden vectors (test-vectors/session-binding/vectors.json)
hex = "0.4"        # decode nonce_hex / expected_data_hash in the session-binding harness
